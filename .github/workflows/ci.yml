# CI del portafolio: coherencia i18n, enlaces internos, HTML válido y CSS compilado al día.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Claves i18n coherentes
        run: node scripts/i18n-check.js
      - name: Enlaces internos válidos
        run: node scripts/check-links.js
      - name: HTML válido
        run: npx --yes html-validate@11 "index.html" "404.html" "contact-*.html" "projects/*.html" "studio/**/*.html"
      - name: CSS de Tailwind compilado y sin cambios pendientes
        run: |
          npm run build:css:all
          git diff --exit-code -- assets/css/tailwind.css studio/assets/css/tailwind.css
